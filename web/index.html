<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Champions Standings Generator</title>
<meta name="description" content="Final-standings graphics for Pokémon Champions events — Top 4, 8 and 16.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="sprites/charizardmegay.png">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>

<header class="bar">
  <div class="bar__brand">
    <img src="sprites/charizardmegay.png" alt="" width="36" height="36">
    <div>
      <h1>Champions Standings Generator</h1>
      <p class="bar__reg" id="reg">Pokémon Champions</p>
    </div>
  </div>
  <div class="bar__actions">
    <button type="button" class="btn btn--ghost" id="load-sample">Load sample</button>
    <button type="button" class="btn btn--ghost" id="import">Import JSON</button>
    <button type="button" class="btn btn--ghost" id="export-json">Export JSON</button>
    <button type="button" class="btn btn--ghost" id="reset">Clear</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </div>
</header>

<main class="layout">
  <section class="preview" aria-label="Preview">
    <div class="preview__head">
      <div class="seg" role="radiogroup" aria-label="Cut">
        <label><input type="radio" name="cut" value="4"><span>Top 4</span></label>
        <label><input type="radio" name="cut" value="8"><span>Top 8</span></label>
        <label><input type="radio" name="cut" value="16"><span>Top 16</span></label>
      </div>
      <span class="preview__size" id="size"></span>
    </div>
    <div class="preview__frame" id="frame-wrap">
      <iframe id="frame" title="Card preview" tabindex="-1"></iframe>
    </div>
    <div class="preview__actions">
      <button type="button" class="btn btn--primary" id="dl-1">Download PNG</button>
      <button type="button" class="btn" id="dl-2">Download @2x</button>
      <button type="button" class="btn" id="share" hidden>Share</button>
    </div>
    <ul class="warnings" id="warnings" aria-live="polite"></ul>
  </section>

  <section class="form" aria-label="Event details">
    <fieldset class="panel">
      <legend>Event</legend>
      <label class="field field--listing">Paste event listing
        <textarea id="listing" rows="4" spellcheck="false" placeholder="VGC Challenge @ Battle and Brew&#10;When: Sun, Sep 13, 2026, 12:00 PM – 4:00 PM ET&#10;Where: 5920 Roswell Rd A120, Sandy Springs, GA 30328&#10;Link: https://www.pokemon.com/…"></textarea>
      </label>
      <p class="listing-status" id="listing-status" aria-live="polite"></p>
      <div class="grid grid--event">
        <label class="field field--wide">Event name<input data-k="event" autocomplete="off"></label>
        <label class="field">Location<input data-k="location" autocomplete="off"></label>
        <label class="field">Date<input type="date" data-k="date"></label>
        <label class="field">Players<input data-k="players" inputmode="numeric" autocomplete="off"></label>
        <label class="field">Division<input data-k="division" autocomplete="off" placeholder="Masters"></label>
        <label class="field">Format<input data-k="format" autocomplete="off"></label>
        <label class="check"><input type="checkbox" data-k="showCp"> Show points</label>
      </div>
    </fieldset>

    <div class="standings" id="standings"></div>
  </section>
</main>

<datalist id="species-list"></datalist>

<dialog id="paste-dialog" class="dialog">
  <form method="dialog">
    <h2 id="paste-title">Paste team</h2>
    <p>Paste a Showdown / PokePaste team export. Species holding their Mega Stone are shown as the Mega form.</p>
    <textarea id="paste-text" rows="12" spellcheck="false" placeholder="Charizard @ Charizardite Y&#10;Ability: Blaze&#10;...&#10;&#10;Torkoal @ Charcoal&#10;..."></textarea>
    <div class="dialog__actions">
      <button value="cancel" class="btn btn--ghost">Cancel</button>
      <button value="ok" class="btn btn--primary">Use team</button>
    </div>
  </form>
</dialog>

<footer class="foot">
  Everything runs in your browser — nothing is uploaded.
</footer>

</body>
</html>
